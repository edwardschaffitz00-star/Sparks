<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sparks — Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0F1A;
      --glass: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --text: #fff;
      --muted: #B8C0D9;
      --pink: #FF2D95;
      --violet: #8B5CFF;
      --cyan: #2DE2E6;
      --danger: #FF4D6D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(255,45,149,0.35), transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(139,92,255,0.35), transparent 45%),
        radial-gradient(ellipse at 50% 100%, rgba(45,226,230,0.18), transparent 50%);
      background-attachment: fixed;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 12px 16px 40px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0 24px;
    }
    .logo {
      font-weight: 700; letter-spacing: 0.12em; font-size: 1.1rem;
      background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-decoration: none;
    }
    .back {
      color: var(--muted); text-decoration: none; font-size: 0.85rem; font-weight: 500;
    }
    .card {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 16px; padding: 22px 18px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    h1 {
      font-size: 1.35rem; font-weight: 700; margin-bottom: 6px;
    }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
    label {
      display: block; font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px;
    }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.28);
      color: var(--text); font-size: 0.95rem; font-family: inherit;
      outline: none;
    }
    input:focus {
      border-color: rgba(139,92,255,0.55);
      box-shadow: 0 0 0 3px rgba(139,92,255,0.2);
    }
    .btn {
      width: 100%; margin-top: 8px; padding: 14px;
      border: none; border-radius: 999px; cursor: pointer;
      font-weight: 700; font-size: 0.95rem; color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--violet));
      box-shadow: 0 8px 32px rgba(255,45,149,0.35);
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg {
      margin-top: 14px; font-size: 0.85rem; line-height: 1.4;
      padding: 10px 12px; border-radius: 10px;
      display: none;
    }
    .msg.err { display: block; background: rgba(255,77,109,0.15); color: #ffb3c1; border: 1px solid rgba(255,77,109,0.35); }
    .msg.ok { display: block; background: rgba(45,226,230,0.12); color: #b8f7f9; border: 1px solid rgba(45,226,230,0.35); }
    .foot {
      text-align: center; margin-top: 18px; color: var(--muted); font-size: 0.9rem;
    }
    .foot a { color: var(--cyan); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <a class="logo" href="index.html">SPARKS</a>
      <a class="back" href="index.html">← Home</a>
    </header>
    <div class="card">
      <h1>Join free</h1>
      <p class="sub">Create your Sparks account. Email + password — no paid plan required.</p>
      <form id="signup-form">
        <div class="field">
          <label for="display_name">DISPLAY NAME</label>
          <input id="display_name" name="display_name" type="text" autocomplete="nickname" placeholder="How you’ll appear" required maxlength="40" />
        </div>
        <div class="field">
          <label for="email">EMAIL</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required />
        </div>
        <div class="field">
          <label for="password">PASSWORD</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6" />
        </div>
        <button class="btn" type="submit" id="submit-btn">Create account</button>
      </form>
      <div id="msg" class="msg" role="status"></div>
      <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      btn.disabled = true;
      try {
        const displayName = document.getElementById('display_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const data = await SparksAuth.signup({ email, password, displayName });
        if (data.session) {
          msg.className = 'msg ok';
          msg.textContent = 'Welcome! Redirecting…';
          setTimeout(() => { location.href = 'index.html'; }, 600);
        } else {
          msg.className = 'msg ok';
          msg.textContent = 'Account created. Check your email to confirm, then log in.';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = err.message || 'Sign up failed';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
